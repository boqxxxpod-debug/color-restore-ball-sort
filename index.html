<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf7ff">
  <title>Color Restore - Ball Sort Puzzle</title>
  <link rel="stylesheet" href="./css/style.css?v=20260812-4">
</head>
<body>
  <main id="app">
    <section id="title-screen" class="screen active">
      <div class="title-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="eyebrow">BALL SORT PUZZLE</p><h1>Color<br><strong>Restore</strong></h1>
      <p class="tagline">色をそろえて、世界を彩ろう。</p>
      <button id="play-btn" class="primary">PLAY</button>
      <button id="select-btn" class="secondary">STAGE SELECT</button>
    </section>

    <section id="select-screen" class="screen">
      <header class="page-head"><button class="icon-btn back-title" aria-label="ホームへ">‹</button><div><small>COLOR RESTORE</small><h2>STAGE SELECT</h2></div><span></span></header>
      <div id="world-tabs" class="world-tabs"></div><div id="stage-grid" class="stage-grid"></div>
    </section>

    <section id="game-screen" class="screen">
      <header class="game-head">
        <button id="home-btn" class="icon-btn" aria-label="ステージ選択へ">⌂</button>
        <div class="game-identity">
          <small id="world-name">GARDEN</small>
          <b class="level-progress" aria-label="全30レベル中、現在レベル1">LEVEL <span id="stage-number">1</span> <span aria-hidden="true">/</span> <span id="stage-total">30</span></b>
        </div>
        <div class="game-stats">
          <span class="moves"><small>MOVES</small><b id="move-count">0</b></span>
          <em id="best-count">BEST —</em>
        </div>
      </header>
      <div id="world" class="world garden">
        <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
        <div class="scenery" aria-hidden="true"></div><div id="tube-board" class="tube-board" aria-label="ボールソート盤面"></div>
        <div id="tutorial" class="tutorial hidden"><span>☝</span><b>この筒をタップ</b><small>空の筒か同じ色の上へ1個移動しよう</small></div>
      </div>
      <nav class="controls"><button id="undo-btn"><span>↶</span>UNDO</button><button id="restart-btn"><span>↻</span>RESTART</button><button id="hint-btn"><span>💡</span>HINT</button></nav>
    </section>
  </main>

  <div id="stuck-modal" class="modal stuck-modal" role="alertdialog" aria-modal="true" aria-labelledby="stuck-title"><div class="modal-card"><div class="stuck-mark" aria-hidden="true">!</div><p>NO SOLUTION</p><h2 id="stuck-title">STUCK!</h2><p class="stuck-help">この状態からはクリアできません<br>UNDO または RESTART してください</p><button id="stuck-undo-btn" class="primary">UNDO</button><button id="stuck-restart-btn" class="secondary">RESTART</button></div></div>
  <div id="clear-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="clear-title"><div class="modal-card"><div class="clear-star">★</div><p>WONDERFUL!</p><h2 id="clear-title">STAGE CLEAR</h2><div class="result"><span>MOVES <b id="result-moves">0</b></span><span>BEST <b id="result-best">0</b></span></div><button id="next-btn" class="primary">NEXT STAGE</button><button id="replay-btn" class="secondary">REPLAY</button><button id="modal-select-btn" class="text-btn">STAGE SELECT</button></div></div>
  <div id="toast" role="status" aria-live="polite"></div><div id="confetti" aria-hidden="true"></div>
  <script src="./data/stages.js?v=20260812-4"></script><script src="./js/storage.js?v=20260812-4"></script><script src="./js/sound.js?v=20260812-4"></script><script src="./js/game.js?v=20260812-4"></script><script src="./js/hint.js?v=20260812-4"></script><script src="./js/stage.js?v=20260812-4"></script><script src="./js/app.js?v=20260812-4"></script>
</body></html>
